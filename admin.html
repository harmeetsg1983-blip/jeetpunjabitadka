<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeet Punjabi Tadka - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
        .btn { background: #e50914; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-refresh { background: #007bff; margin-bottom: 10px; }
        .order-title { font-size: 1.1em; color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Jeet Punjabi Tadka - Admin Panel</h2>
    <button class="btn btn-refresh" onclick="loadOrders()">Refresh Orders</button>
    
    <div id="orders-container">ऑर्डर लोड हो रहे हैं...</div>

    <script>
        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = "लोड हो रहा है...";

            if (!window.supabaseClient) {
                container.innerHTML = "Supabase कॉन्फ़िगरेशन नहीं मिला!";
                return;
            }

            const { data: orders, error } = await window.supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = "ऑर्डर लोड करने में एरर: " + error.message;
                return;
            }

            if (!orders || orders.length === 0) {
                container.innerHTML = "कोई ऑर्डर नहीं मिला।";
                return;
            }

            container.innerHTML = "";
            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="order-title">Order No: ${order.order_id || 'N/A'}</div>
                    <p><b>नाम:</b> ${order.customer_name || 'N/A'}</p>
                    <p><b>मोबाइल:</b> ${order.customer_phone || 'N/A'}</p>
                    <p><b>पता:</b> ${order.address || 'N/A'}</p>
                    <p><b>टोटल अमाउंट:</b> ₹${order.total_amount || 0}</p>
                    <p><b>स्टेटस:</b> ${order.status || 'new'}</p>
                `;
                container.appendChild(card);
            });
        }

        window.onload = loadOrders;
    </script>
</body>
</html>
