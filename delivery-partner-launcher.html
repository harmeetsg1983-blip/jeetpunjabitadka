<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="./delivery-partner-launcher-manifest.webmanifest?v=1">
<link rel="icon" href="./jpt-delivery-partner-icon-512.png" type="image/png">
<title>JPT Delivery Partner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#050505}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:
radial-gradient(circle at 50% 18%,#4a350d 0,#120d05 35%,#050505 75%);padding:16px;overflow:auto}
.card{width:calc(100vw - 32px);max-width:430px;max-height:calc(100dvh - 32px);
overflow:auto;border:1px solid #d8ae42;border-radius:28px;padding:18px 16px 16px;
text-align:center;background:linear-gradient(145deg,#211707,#080808);
box-shadow:0 20px 80px #000,0 0 45px #d8ae4222}
.logo{display:block;width:min(250px,66vw);height:auto;aspect-ratio:1;margin:0 auto 12px;
border-radius:50%;object-fit:cover;border:2px solid #d8ae42;
box-shadow:0 0 34px #d8ae4266}
h1{font:900 clamp(20px,6vw,25px) system-ui;color:#f5d878;margin:7px 0 3px}
.sub{color:#d0d0d0;font:600 13px system-ui;margin-bottom:12px}
.tag{display:inline-block;color:#f7df8a;font:800 11px system-ui;letter-spacing:1.5px;
border:1px solid #d8ae42;border-radius:999px;padding:6px 10px;margin-bottom:12px}
.rider{height:6px;width:86%;max-width:320px;margin:0 auto 14px;border-radius:99px;
background:linear-gradient(90deg,transparent,#d8ae42,#fff1a4,#d8ae42,transparent);
box-shadow:0 0 18px #d8ae42;animation:run 1.6s linear infinite}
@keyframes run{0%{transform:translateX(-16px);opacity:.45}50%{opacity:1}100%{transform:translateX(16px);opacity:.45}}
button{display:block;width:100%;border:1px solid #d8ae42;border-radius:14px;padding:13px 16px;
font:900 15px system-ui;cursor:pointer}
#install{background:#d8ae42;color:#111;box-shadow:0 8px 22px #d8ae4238}
#open{background:#17130a;color:#f4d77a;margin-top:9px}
#share{background:#090909;color:#f4d77a;margin-top:9px}
.note{color:#999;font:500 11px system-ui;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<iframe id="app" src="./delivery-partner-app.html?v=delivery-shell-1" title="JPT Delivery Partner App"></iframe>
<div id="gate">
  <div class="card">
    <img class="logo" src="./jpt-delivery-partner-icon-512.png" alt="Jeet Punjabi Tadka Delivery Partner">
    <div class="tag">OFFICIAL DELIVERY PARTNER APP</div>
    <h1>JEET PUNJABI TADKA</h1>
    <div class="sub">Delivery Partner • Delivering Happiness</div>
    <div class="rider"></div>
    <button id="install">INSTALL APP</button>
    <button id="open">OPEN APP</button>
    <button id="share">↗ SHARE LINK</button>
    <div class="note">Install once • Then open directly from your phone</div>
  </div>
</div>
<script>
(function(){
'use strict';
var gate=document.getElementById('gate'),install=document.getElementById('install'),
open=document.getElementById('open'),share=document.getElementById('share'),deferred=null;
function hideGate(){gate.classList.add('hidden')}
open.addEventListener('click',hideGate);
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferred=e; install.classList.remove('hidden');
});
install.addEventListener('click',async function(){
  if(!deferred){hideGate();return;}
  deferred.prompt();
  try{await deferred.userChoice;}catch(_){}
  deferred=null; hideGate();
});
share.addEventListener('click',async function(){
  var data={title:'Jeet Punjabi Tadka — Delivery Partner',
    text:'Join Jeet Punjabi Tadka as a Delivery Partner',
    url:new URL('./delivery-partner-launcher.html',location.href).href};
  if(navigator.share){try{await navigator.share(data)}catch(_){}}
  else if(navigator.clipboard){try{
    await navigator.clipboard.writeText(data.url);
    share.textContent='✓ LINK COPIED';
    setTimeout(()=>share.textContent='↗ SHARE LINK',1600);
  }catch(_){}}
});
window.addEventListener('appinstalled',hideGate);
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./delivery-partner-launcher-sw.js?v=1',{scope:'./'}).catch(function(){});
  });
}
})();
</script>
</body>
</html>
