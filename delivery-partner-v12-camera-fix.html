<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Jeet Punjabi Tadka — Delivery Partner V12</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="./delivery-partner-v11.html" title="Jeet Punjabi Tadka Delivery Partner App V12"></iframe><script>(function(){const f=document.getElementById('app');f.addEventListener('load',function(){try{const w=f.contentWindow,d=f.contentDocument;const patch=w.document.createElement('script');patch.textContent=`(function(){window.captureSelfie=function(){var v=document.getElementById('video'),c=document.getElementById('canvas');if(!window.stream||!v||!c)return;if(!v.videoWidth||!v.videoHeight){alert('Camera frame is not ready. Please wait a moment and tap Capture again.');return}var w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);var active=window.stream;v.style.display='none';c.style.display='block';document.getElementById('capture').disabled=true;document.getElementById('retake').classList.remove('hidden');document.getElementById('selfieState').textContent='Live selfie: Captured';active.getTracks().forEach(function(t){t.stop()});window.stream=null;c.toBlob(function(b){window.selfieBlob=b},'image/jpeg',.88)};})();`;d.head.appendChild(patch);console.log('JPT V12 camera capture fix loaded');}catch(e){console.error('V12 camera patch failed',e)}})})();</script></body></html>
