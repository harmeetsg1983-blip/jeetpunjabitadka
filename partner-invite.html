<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeet Punjabi Tadka — Partner Setup</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:grid;place-items:center;padding:18px}
.card{width:min(430px,100%);background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid #5a461b;border-radius:20px;padding:22px;box-shadow:0 20px 70px #000}
.logo{width:58px;height:58px;border:1px solid #d8ae42;border-radius:15px;display:grid;place-items:center;color:#d8ae42;font-weight:1000;margin-bottom:14px}
h1{margin:0;color:#d8ae42;font-size:22px}.muted{color:#999;font-size:12px;line-height:1.5;margin:7px 0 18px}
label{display:block;color:#aaa;font-size:11px;margin:11px 0 5px}
input{width:100%;padding:12px;background:#151515;color:#fff;border:1px solid #444;border-radius:10px}
button{width:100%;margin-top:15px;padding:12px;border:0;border-radius:10px;background:#d8ae42;color:#111;font-weight:900;cursor:pointer}
button:disabled{opacity:.55}.msg{min-height:22px;margin-top:10px;font-size:12px}.success{color:#79e39b}.error{color:#ff9999}
</style>
</head>
<body>
<section class="card">
<div class="logo">JPT</div>
<h1>Partner Account Setup</h1>
<div class="muted">Set your password to activate your restaurant partner account. After setup, sign in to the Partner Dashboard with your invited email.</div>
<label>Email</label>
<input id="email" type="email" readonly>
<label>New Password</label>
<input id="password" type="password" autocomplete="new-password" placeholder="Create a password">
<label>Confirm Password</label>
<input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password">
<button id="save">SET PASSWORD & ACTIVATE</button>
<div id="msg" class="msg"></div>
</section>

<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const sb=supabase.createClient(window.JPT_SUPABASE_URL,window.JPT_SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
function msg(t,c=''){$('msg').className='msg '+c;$('msg').textContent=t}
async function boot(){
  const {data,error}=await sb.auth.getSession();
  if(error){msg(error.message,'error');return}
  if(!data.session){msg('Please open this page from the Partner invitation email.','error');return}
  $('email').value=data.session.user?.email||'';
}
$('save').onclick=async()=>{
  const p=$('password').value, c=$('confirm').value;
  if(p.length<8){msg('Password must be at least 8 characters.','error');return}
  if(p!==c){msg('Passwords do not match.','error');return}
  $('save').disabled=true;msg('Activating partner account…');
  try{
    const {error}=await sb.auth.updateUser({password:p});
    if(error)throw error;
    msg('Partner account activated successfully. You can now sign in to the Partner Dashboard.','success');
    setTimeout(()=>location.href='./admin.html',1800);
  }catch(e){msg(e.message||'Activation failed.','error');$('save').disabled=false}
};
boot();
</script>
</body>
</html>
