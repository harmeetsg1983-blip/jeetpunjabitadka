<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPT Central Media Lab V1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:5;background:#0b0b0b;border-bottom:1px solid #30250f;padding:12px}.brand{color:#d8ae42;font-weight:950;font-size:20px}.sub{color:#999;font-size:12px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:14px;margin-top:12px}.input,.select,.btn{background:#171717;color:#fff;border:1px solid #414141;border-radius:10px;padding:10px 12px}.select,.input{width:100%}.btn{cursor:pointer}.gold{background:#d8ae42;color:#111;border-color:#d8ae42;font-weight:900}.red{border-color:#7d3030;color:#ff9999}.muted{color:#999;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px;border-radius:10px;background:#171717;border:1px solid #333;font-size:12px;margin-top:8px}.field{margin:8px 0}.field label{display:block;color:#aaa;font-size:11px;margin-bottom:4px}@media(max-width:700px){.two{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><div class="wrap" style="padding:0"><div class="brand">CENTRAL MEDIA LAB</div><div class="sub">Dynamic multi-outlet media controller • Campaign Hero is separate</div></div></header>
<main class="wrap">
<div id="auth" class="card"><h3>Owner / Partner Login</h3><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password" style="margin-top:8px"><button id="login" class="btn gold" style="margin-top:8px">Login</button><div id="msg" class="notice"></div></div>
<div id="jptCentralMediaLab"></div>
</main>
<script>
(function(){
const URL='https://qrkbhrmxejtpvheplath.supabase.co';
const KEY=window.JPT_SUPABASE_PUBLISHABLE_KEY||'sb_publishable_xySAr0cGnVCaC_sgtwk8Zw_IW_b5sgh';
window.sb=window.supabase.createClient(URL,KEY);
const auth=document.getElementById('auth'),msg=document.getElementById('msg');
async function ready(){const r=await window.sb.auth.getSession();if(r.data&&r.data.session){auth.style.display='none';loadLab()}else auth.style.display='block'}
document.getElementById('login').onclick=async()=>{msg.textContent='Signing in…';const r=await window.sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;return}auth.style.display='none';loadLab()};
async function loadLab(){if(window.JPTCentralMediaLab)try{await window.JPTCentralMediaLab.load()}catch(e){msg.textContent=e.message}}
window.addEventListener('DOMContentLoaded',ready);
})();
</script>
<script src="./jpt-central-media-lab-v1.js?v=1"></script>
</body></html>
