<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPT Banner Admin Studio V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{padding:16px 18px;border-bottom:1px solid #2b2b2b;background:#090909;position:sticky;top:0;z-index:10}
h1{margin:0;color:#d8ae42;font-size:20px}.sub{color:#888;font-size:11px;margin-top:4px}
main{max-width:980px;margin:auto;padding:16px}.card{background:#0c0c0c;border:1px solid #292929;border-radius:14px;padding:14px;margin-bottom:14px}
.notice{border:1px solid #493c1d;background:#151108;color:#d8ae42;border-radius:10px;padding:10px;font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid #444;background:#151515;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:#d8ae42;color:#111;border-color:#d8ae42}
.panel{display:none}.panel.active{display:block}
iframe{width:100%;height:760px;border:1px solid #292929;border-radius:12px;background:#000}
</style>
</head>
<body>
<header><h1>JEET PUNJABI TADKA — Banner Admin Studio V1</h1><div class="sub">ISOLATED FEATURE • production Partner PWA remains hard-frozen</div></header>
<main>
<div class="notice">This studio is deliberately separate from the frozen installed Partner App. It does not modify admin.html, the order engine, ringtone/audio path, service worker, or partner-access bridge.</div>
<div class="tabs">
<button class="tab active" data-tab="preview">Upload / Fit / Preview</button>
<button class="tab" data-tab="campaign">Campaign Manager</button>
</div>
<section id="preview" class="panel active card">
<iframe src="./jpt-banner-studio-preview.html" title="JPT Banner Studio Preview"></iframe>
</section>
<section id="campaign" class="panel card">
<iframe src="./jpt-banner-campaign-preview.html" title="JPT Banner Campaign Manager Preview"></iframe>
</section>
</main>
<script>
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');
});
</script>
</body>
</html>
