name: Build JPT Customer Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-customer/**'
      - '.github/workflows/build-jpt-customer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Customer debug APK
        working-directory: android-customer
        run: gradle assembleDebug --no-daemon
      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: JPT-Customer-Debug-APK
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
