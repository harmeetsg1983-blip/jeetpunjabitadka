name: JPT Customer Production Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode production signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.JPT_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jpt-release.keystore"

      - name: Build signed Customer release APK
        env:
          JPT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/jpt-release.keystore
          JPT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.JPT_ANDROID_KEYSTORE_PASSWORD }}
          JPT_RELEASE_KEY_ALIAS: ${{ secrets.JPT_ANDROID_KEY_ALIAS }}
          JPT_RELEASE_KEY_PASSWORD: ${{ secrets.JPT_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$JPT_RELEASE_KEYSTORE_PASSWORD"
          test -n "$JPT_RELEASE_KEY_ALIAS"
          test -n "$JPT_RELEASE_KEY_PASSWORD"
          gradle -p android-customer :app:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android-customer/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jpt-customer-native-release
          path: android-customer/app/build/outputs/apk/release/app-release.apk
