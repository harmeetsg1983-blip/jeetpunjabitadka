name: Build JPT Delivery Partner APK

on:
  push:
    paths:
      - 'android-delivery-partner/**'
      - '.github/workflows/build-delivery-partner-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-delivery-partner
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JPT-Delivery-Partner-APK
          path: android-delivery-partner/app/build/outputs/apk/debug/app-debug.apk
