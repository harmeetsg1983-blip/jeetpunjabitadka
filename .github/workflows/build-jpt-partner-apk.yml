name: Build JPT Partner Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-partner/**'
      - '.github/workflows/build-jpt-partner-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s android-partner/app/google-services.json
          grep -Fq '"project_id": "jeet-punjabi-tadka"' android-partner/app/google-services.json
          grep -Fq '"package_name": "com.jeetpunjabitadka.partner"' android-partner/app/google-services.json

      - name: Build Partner debug APK
        working-directory: android-partner
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: JPT-Partner-Debug-APK
          path: android-partner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
