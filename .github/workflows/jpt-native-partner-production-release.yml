name: JPT Partner Production Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode production signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.JPT_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jpt-release.keystore"

      - name: Build signed Partner release APK
        env:
          JPT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/jpt-release.keystore
          JPT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.JPT_ANDROID_KEYSTORE_PASSWORD }}
          JPT_RELEASE_KEY_ALIAS: ${{ secrets.JPT_ANDROID_KEY_ALIAS }}
          JPT_RELEASE_KEY_PASSWORD: ${{ secrets.JPT_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$JPT_RELEASE_KEYSTORE_PASSWORD"
          test -n "$JPT_RELEASE_KEY_ALIAS"
          test -n "$JPT_RELEASE_KEY_PASSWORD"
          gradle -p android-partner :app:assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android-partner/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jpt-partner-native-release
          path: android-partner/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Supabase release storage
        env:
          SUPABASE_URL: "https://qrkbhrmxejtpvheplath.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          FILE_NAME="jpt_partner_native_v1-v3.apk"
          curl --fail-with-body -X POST "$SUPABASE_URL/storage/v1/object/native-app-releases/$FILE_NAME" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@android-partner/app/build/outputs/apk/release/app-release.apk"
          echo "RELEASE_URL=$SUPABASE_URL/storage/v1/object/public/native-app-releases/$FILE_NAME" >> "$GITHUB_ENV"

      - name: Publish release policy URL
        env:
          SUPABASE_URL: "https://qrkbhrmxejtpvheplath.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_URL: ${{ env.RELEASE_URL }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$RELEASE_URL"
          curl --fail-with-body -X PATCH "$SUPABASE_URL/rest/v1/app_release_policies?app_id=eq.jpt_partner_native_v1&platform=eq.android" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "{\"update_url\":\"$RELEASE_URL\"}"
