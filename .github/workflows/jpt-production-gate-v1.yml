name: JPT Production Gate V1 - Safe Preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4

      - name: Verify protected core files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html customer-app.html customer-app-sw.js admin.html delivery-partner-app.html; do
            test -f "$f"
            echo "GREEN: $f present"
          done

      - name: Verify customer checkout safety
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<option value="COD"' index.html
          grep -Fq '<option value="UPI"' index.html

          if grep -Eqi 'UPI payment required|Complete payment first|jpt-upi-required' index.html; then
            echo "RED: legacy UPI-only gate found in index.html"
            exit 1
          fi

          echo "GREEN: COD + UPI payment choices present"
          echo "GREEN: legacy UPI-only gate absent"

      - name: Verify customer PWA install path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'beforeinstallprompt' customer-app.html
          grep -Fq 'serviceWorker.register' customer-app.html
          grep -Fq 'customer-app-sw.js' customer-app.html
          grep -Fq 'customer-app.html' customer-app-sw.js
          echo "GREEN: customer PWA install/service-worker wiring present"

      - name: Verify active partner order runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f jpt-unified-partner-orders-v1.js
          grep -Fq 'jpt-unified-partner-orders-v1.js' admin.html
          grep -Fq 'admin.html?v=20261019-order-confirmation-7' partner-v107.html
          grep -Fq 'jpt-partner-access-bridge-v2.js' admin.html
          grep -Fq 'jpt_partner_transition_order' jpt-unified-partner-orders-v1.js
          grep -Fq 'postgres_changes' jpt-unified-partner-orders-v1.js
          grep -Fq 'fallbackPollBusy' jpt-unified-partner-orders-v1.js
          grep -Fq 'oldTerminal && nextTerminal && oldStatus!==nextStatus' jpt-unified-partner-orders-v1.js
          grep -Fq ".in('status',['new','accepted','preparing','ready','out_for_delivery'])" jpt-unified-partner-orders-v1.js
          grep -Fq "q=q.in('status',['delivered','cancelled'])" jpt-unified-partner-orders-v1.js
          grep -Fq 'pendingRingtoneOrderIds' jpt-unified-partner-orders-v1.js
          grep -Fq 'failedRingtoneOrderIds' jpt-unified-partner-orders-v1.js
          grep -Fq 'function acknowledgeRingtone(orderId)' jpt-unified-partner-orders-v1.js
          grep -Fq 'function hideOrderAlarmCard()' jpt-unified-partner-orders-v1.js
          grep -Fq "alarmText.textContent='Order #'" jpt-unified-partner-orders-v1.js
          grep -Fq 'UPI payment must be verified before accepting this order.' jpt-unified-partner-orders-v1.js
          grep -Fq 'UPI payment must be verified before marking this order ready.' jpt-unified-partner-orders-v1.js
          ! grep -Fq '1000449491.mp4' admin.html
          ! grep -Fq '},15000)' admin.html
          echo "GREEN: live-status queue pagination, one queued alert owner, no legacy ringtone or 15-second order poll"

      - name: Verify delivery-event migration safety
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20261019_jpt_order_flow_delivery_event_hardening.sql"
          test -f "$migration"
          grep -Fq 'PERFORM realtime.send(' "$migration"
          grep -Fq "'jpt:delivery:rider:'" "$migration"
          grep -Fq 'DROP TRIGGER IF EXISTS trg_delivery_auto_offer_when_ready ON public.orders;' "$migration"
          if grep -Eiq '^[[:space:]]*PERFORM[[:space:]]+realtime\.broadcast_changes\(' "$migration"; then
            echo "RED: unsupported broadcast_changes call returned to delivery migration"
            exit 1
          fi
          grep -Fq "const CACHE='jpt-partner-pwa-v28-alert-ack-confirmation';" jpt-partner-sw.js
          echo "GREEN: delivery broadcasts use realtime.send, duplicate READY trigger is removed, and partner cache generation is explicit"

      - name: Run order lifecycle regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/jpt-order-monotonicity.test.cjs

      - name: Verify locked ringtone integrity
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected_size=(
            [ringtones/1000449570.mp4]=2780660
            [ringtones/1000449571.mp4]=2825197
            [ringtones/1000449572.mp4]=237252
          )
          declare -A expected_sha=(
            [ringtones/1000449570.mp4]=9106a098deac4d9493924457ea676ec3bc2bc2460e54d902703aa1c878fd63c4
            [ringtones/1000449571.mp4]=d491bc664f55ac0c4e717e60b9b85827fad589c15153436000367e6264a3860c
            [ringtones/1000449572.mp4]=34231d662e3416f66278820b187c4116189019e7bae4122e9d0295d10cedbb15
          )
          echo "INFO: Legacy 1000449491.mp4 asset is left untouched but is no longer referenced by the active partner order runtime."
          for f in "${!expected_size[@]}"; do
            test -f "$f" || { echo "RED: missing locked ringtone $f"; exit 1; }
            actual_size=$(stat -c '%s' "$f")
            test "$actual_size" = "${expected_size[$f]}" || { echo "RED: size mismatch $f ($actual_size != ${expected_size[$f]})"; exit 1; }
            actual_sha=$(sha256sum "$f" | awk '{print $1}')
            test "$actual_sha" = "${expected_sha[$f]}" || { echo "RED: SHA-256 mismatch $f"; exit 1; }
            echo "GREEN: locked ringtone verified $f"
          done

      - name: Verify inline JavaScript in partner HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.check = False
                  self.parts = []
                  self.found = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script': return
                  attrs = dict(attrs)
                  self.active = 'src' not in attrs
                  kind = (attrs.get('type') or '').strip().lower()
                  self.check = self.active and (not kind or kind in ('text/javascript', 'application/javascript', 'module'))
                  self.parts = []
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() != 'script' or not self.active: return
                  source = ''.join(self.parts)
                  if self.check and source.strip(): self.found.append(source)
                  self.active = self.check = False
                  self.parts = []

          total = 0
          with tempfile.TemporaryDirectory() as td:
              for name in ('admin.html', 'partner-v107.html', 'delivery-partner-app.html'):
                  parser = Scripts()
                  parser.feed(Path(name).read_text(encoding='utf-8'))
                  for index, source in enumerate(parser.found, 1):
                      checkfile = Path(td) / f'{Path(name).stem}-{index}.js'
                      checkfile.write_text(source, encoding='utf-8')
                      result = subprocess.run(['node', '--check', str(checkfile)], capture_output=True, text=True)
                      if result.returncode:
                          raise SystemExit(f'RED: inline script syntax failed: {name} script #{index}\\n{result.stderr}')
                      total += 1
                  print(f'GREEN: {name}: {len(parser.found)} inline JavaScript blocks syntax-checked')
          print(f'GREEN: {total} inline JavaScript blocks passed Node syntax validation')
          PY

      - name: Verify root JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null
            count=$((count+1))
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
          echo "GREEN: $count root JavaScript files passed node syntax validation"

      - name: Report missing future production layers
        shell: bash
        run: |
          set -euo pipefail
          echo "INFO: This gate does not modify source, Supabase, or deployment."
          echo "INFO: FCM/Sentry/Playwright are future reliability layers."
          echo "GREEN: production source preflight completed"
