name: JPT Technical Control V3 - Command Router

on:
  workflow_dispatch:
    inputs:
      command:
        description: "JPT command"
        required: true
        default: "JPT-CHECK"
        type: string

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  command-router:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, 'JPT-')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve command
        id: command
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_COMMAND: ${{ inputs.command }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            COMMAND="$DISPATCH_COMMAND"
          else
            COMMAND="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}')"
          fi

          echo "COMMAND=$COMMAND"
          echo "command=$COMMAND" >> "$GITHUB_OUTPUT"

      - name: Allowlist gate
        shell: bash
        env:
          COMMAND: ${{ steps.command.outputs.command }}
        run: |
          set -euo pipefail

          case "$COMMAND" in
            "JPT-CHECK")
              echo "GREEN: JPT-CHECK allowed"
              ;;
            "JPT-DIAGNOSE")
              echo "GREEN: JPT-DIAGNOSE allowed"
              ;;
            "JPT-REPAIR REMOVE_STALE_VISUAL_SKIN_V2")
              echo "GREEN: approved repair allowed"
              ;;
            *)
              echo "FAIL: command is not allowlisted"
              exit 1
              ;;
          esac

      - name: Protected baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f admin.html
          test -f jpt-partner-final-touch-v10.js

          grep -q 'jpt-partner-final-touch-v10.js?v=10-bridge-20260924' admin.html

          ! grep -q 'jpt-partner-visual-layer-final-v1.js' admin.html

          echo "GREEN: protected baseline passed"

      - name: Execute command
        shell: bash
        env:
          COMMAND: ${{ steps.command.outputs.command }}
        run: |
          set -euo pipefail

          case "$COMMAND" in

            "JPT-CHECK")
              echo "=== JPT CHECK ==="
              test -f admin.html
              test -f jpt-partner-final-touch-v10.js

              if grep -q 'jpt-partner-visual-skin-v2.js' admin.html; then
                echo "YELLOW: stale visual-skin-v2 reference exists"
              else
                echo "GREEN: no stale visual-skin-v2 reference"
              fi

              echo "GREEN: check completed"
              ;;

            "JPT-DIAGNOSE")
              echo "=== JPT DIAGNOSE ==="

              echo "--- V10 ---"
              grep -q 'jpt-partner-final-touch-v10.js?v=10-bridge-20260924' admin.html
              echo "GREEN: V10 preserved"

              echo "--- Rejected visual layer ---"
              if grep -q 'jpt-partner-visual-layer-final-v1.js' admin.html; then
                echo "FAIL: rejected visual layer referenced"
                exit 1
              else
                echo "GREEN: rejected visual layer not referenced"
              fi

              echo "--- Stale visual skin ---"
              if grep -q 'jpt-partner-visual-skin-v2.js' admin.html; then
                echo "YELLOW: stale visual-skin-v2 reference exists"
              else
                echo "GREEN: stale visual-skin-v2 reference absent"
              fi

              echo "GREEN: diagnosis completed"
              ;;

            "JPT-REPAIR REMOVE_STALE_VISUAL_SKIN_V2")
              echo "=== JPT REPAIR ==="

              if grep -q 'jpt-partner-visual-skin-v2.js' admin.html; then
                sed -i '/jpt-partner-visual-skin-v2\.js/d' admin.html
                echo "GREEN: stale reference removed"
              else
                echo "GREEN: nothing to repair"
              fi
              ;;

          esac

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          test -f admin.html
          test -f jpt-partner-final-touch-v10.js

          grep -q 'jpt-partner-final-touch-v10.js?v=10-bridge-20260924' admin.html

          ! grep -q 'jpt-partner-visual-layer-final-v1.js' admin.html

          if grep -q 'jpt-partner-visual-skin-v2.js' admin.html; then
            echo "FAIL: stale reference remains"
            exit 1
          fi

          echo "GREEN: validation passed"

      - name: Commit approved repair
        if: >
          success() &&
          steps.command.outputs.command == 'JPT-REPAIR REMOVE_STALE_VISUAL_SKIN_V2'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- admin.html; then
            echo "GREEN: no source change required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add admin.html
          git commit -m "JPT V3 command router: approved repair"
          git push origin HEAD:main

          echo "GREEN: approved repair committed"
