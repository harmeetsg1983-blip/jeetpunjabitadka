name: JPT Native Partner Build
on:
  push:
    branches: ["jpt-native-partner-v1"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Install image renderer
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Render Partner launcher logo
        run: |
          mkdir -p android-partner/app/src/main/res/drawable
          base64 -d android-partner/branding/jpt_partner_lighting_128.jpg.b64 > android-partner/app/src/main/res/drawable/jpt_partner_logo.jpg
      - name: Generate CI signing key
        run: |
          keytool -genkeypair -v -keystore android-partner/ci-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: gradle -p android-partner :app:assembleDebug
      - name: Zipalign and sign APK
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          $ZIPALIGN -f 4 android-partner/app/build/outputs/apk/debug/app-debug.apk /tmp/jpt-partner-aligned.apk
          mv /tmp/jpt-partner-aligned.apk android-partner/app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER sign --ks android-partner/ci-debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey android-partner/app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER verify --verbose android-partner/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jpt-partner-native-debug
          path: android-partner/app/build/outputs/apk/debug/app-debug.apk
