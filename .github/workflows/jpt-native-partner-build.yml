name: JPT Native Partner Build
on:
  push:
    branches: ["jpt-native-partner-v1"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Render Partner launcher logo
        run: |
          mkdir -p android-partner/app/src/main/res/drawable
          convert -background none android-partner/app/src/main/res/drawable/jpt_partner_logo.svg -resize 512x512 android-partner/app/src/main/res/drawable/jpt_partner_logo.png
      - run: gradle -p android-partner :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jpt-partner-native-debug
          path: android-partner/app/build/outputs/apk/debug/app-debug.apk
