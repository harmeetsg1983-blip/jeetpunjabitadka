name: JPT V106 Royal Gold Launch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v106-royal-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V106 Royal Gold source patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v106_apply.py
          python3 /tmp/v106_apply.py

      - name: Install V106 SQL and deployment notes
        shell: bash
        run: |
          mkdir -p supabase
          echo '' | base64 -d > supabase/V106_ROYAL_SCRATCH.sql
          cat > V106_ROYAL_GOLD_README.md <<'MD'
          # JPT V106 — Royal Gold Launch

          This is an additive patch to the existing Jeet Punjabi Tadka production source. It does not create a new app or replace the existing menu.

          Included:
          - Royal Gold Scratch & Reveal styling with metallic-gold reward amount and sweep animation.
          - Reward data comes only from active outlet-configured scratch offers.
          - No hardcoded ₹40 reward fallback in the customer calculation.
          - Five supported configured slabs: 20% up to ₹40, 30% up to ₹60, 40% up to ₹80, 50% up to ₹100, 60% up to ₹120.
          - Admin offer editor fields for maximum discount and Royal Gold Scratch flag.
          - Admin one-tap setup for the five V106 scratch slabs for the selected outlet.
          - Existing menu, categories, prices, cart, WhatsApp, UPI, multi-outlet and order-save compatibility are preserved.

          Supabase:
          Run `supabase/V106_ROYAL_SCRATCH.sql` once in the SAME Supabase project used by the live menu.

          Verification gate:
          Source-level validation is not a live verification. After the workflow completes, test a real customer order and the Royal Gold Scratch flow on the deployed site.
          MD

      - name: Validate V106 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          i=Path('index.html').read_text(encoding='utf-8')
          a=Path('admin.html').read_text(encoding='utf-8')
          assert 'function getScratchOffers()' in i
          assert "source:'scratch'" in i
          assert 'max_discount' in i
          assert 'royal-gold' in i
          assert 'id="omax"' in a
          assert 'id="oscratch"' in a
          assert 'ensureV106ScratchSlabs' in a
          assert Path('supabase/V106_ROYAL_SCRATCH.sql').exists()
          print('V106 validation: PASS')
          PY
          git diff --check

      - name: Commit V106 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html supabase/V106_ROYAL_SCRATCH.sql V106_ROYAL_GOLD_README.md
          if git diff --cached --quiet; then
            echo "No changes to commit; V106 may already be applied."
          else
            git commit -m "Launch JPT V106 Royal Gold scratch flow"
            git push
          fi
