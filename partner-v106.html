<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeet Punjabi Tadka — Restaurant Partner App V106</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
#partnerFrame{width:100%;height:100%;border:0;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090909;color:#f4d77a;font:700 16px system-ui;z-index:10}
</style>
</head>
<body>
<div id="boot">Loading Restaurant Partner App…</div>
<iframe id="partnerFrame" src="./admin.html" title="Jeet Punjabi Tadka Restaurant Partner App"></iframe>
<script>
(function(){
  const frame=document.getElementById('partnerFrame');
  const boot=document.getElementById('boot');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const win=frame.contentWindow;
      if(!doc||!win) throw new Error('Partner app frame unavailable');
      const s=doc.createElement('script');
      s.src='./partner-order-flow-v106-hotfix.js';
      s.async=false;
      s.onload=function(){boot.style.display='none';};
      s.onerror=function(){boot.textContent='Partner order module could not load. Please refresh.';};
      doc.body.appendChild(s);
      setTimeout(function(){boot.style.display='none';},1200);
    }catch(e){
      boot.textContent='Partner App loading error. Please refresh.';
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
