<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeet Punjabi Tadka — Restaurant Partner App V106</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
#partnerFrame{width:100%;height:100%;border:0;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090909;color:#f4d77a;font:700 16px system-ui;z-index:10}
</style>
</head>
<body>
<div id="boot">Loading Restaurant Partner App…</div>
<iframe id="partnerFrame" src="./admin.html" title="Jeet Punjabi Tadka Restaurant Partner App"></iframe>
<script>
(function(){
  const frame=document.getElementById('partnerFrame');
  const boot=document.getElementById('boot');

  function hideBoot(){
    boot.style.display='none';
  }

  function showError(msg){
    console.error(msg);
    hideBoot();
  }

  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const win=frame.contentWindow;

      if(!doc || !win){
        showError('Partner app frame unavailable');
        return;
      }

      const s=doc.createElement('script');
      s.src='./partner-order-flow-v106-hotfix.js';
      s.async=false;

      s.onload=function(){
        const p=doc.createElement('script');
        p.src='./partner-payment-gate-v106.js?v=launch1';
        p.async=false;

        p.onload=function(){
          const st=doc.createElement('script');
          st.src='./jpt-v106-partner-scroll-root-fix-v4.js?v=4';
          st.async=false;

  st.onload=function(){
  const ops=doc.createElement('script');
  ops.src='./jpt-v106-partner-operations-v2.js?v=ops2';
  ops.async=false;

  ops.onload=function(){
    console.log('JPT Partner operations module loaded');
  };

  ops.onerror=function(){
    console.error('Partner operations module failed');
  };

  doc.body.appendChild(ops);

  console.log('JPT Partner modules loaded');
};

          st.onerror=function(){
            console.error('Scroll stability module failed');
          };

          doc.body.appendChild(st);
        };

        p.onerror=function(){
          console.error('Payment gate module failed');
        };

        doc.body.appendChild(p);
      };

      s.onerror=function(){
        console.error('Partner order module failed');
      };

      doc.body.appendChild(s);

    }catch(e){
      console.error('Partner App loading error',e);
    }

    hideBoot();
  });

  /* Safety: never allow the wrapper overlay to block the working admin panel */
  setTimeout(hideBoot,1200);
})();
</script>
</body>
</html>
