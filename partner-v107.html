<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Jeet Punjabi Tadka — Restaurant Partner App V107</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
#partnerFrame{width:100%;height:100%;border:0;display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090909;color:#f4d77a;font:700 16px system-ui;z-index:10}
</style>
</head>
<body>
<div id="boot">Loading Restaurant Partner App…</div>

<!-- V108 FRESH WRAPPER
     IMPORTANT: V106 overlay modules are intentionally NOT injected here.
     V107 admin.html already contains its own Orders, realtime, timer,
     outlet access and dashboard logic. The old scroll-root module expected
     #ordersList and could force a reload loop because V107 uses #ordersBody.
-->
<iframe id="partnerFrame"
        src="./admin.html?v=20261010-auth-order-sync-2"
        title="Jeet Punjabi Tadka Restaurant Partner App"></iframe>

<script>
(function(){
  'use strict';

  const frame=document.getElementById('partnerFrame');
  const boot=document.getElementById('boot');

  function hideBoot(){
    if(boot) boot.style.display='none';
  }

  const q=new URLSearchParams(location.search);
  const pushOrderId=q.get('order_id')||'';
  const pushOutletId=q.get('outlet_id')||'';
  const pushOrderNo=q.get('order_no')||'';
  if(q.get('push')==='order'){
    const base='./admin.html?v=20261010-auth-order-sync-2';
    const p=new URLSearchParams({push:'order'});
    if(pushOrderId)p.set('order_id',pushOrderId);
    if(pushOutletId)p.set('outlet_id',pushOutletId);
    if(pushOrderNo)p.set('order_no',pushOrderNo);
    frame.src=base+'&'+p.toString();
  }
  function focusPushedOrder(){
    if(q.get('push')!=='order')return false;
    try{
      const w=frame.contentWindow, d=w.document;
      if(typeof w.showPanel==='function')w.showPanel('orders');
      if(pushOrderId && w.JPTPartnerOrdersUI?.openOrderDetail){w.JPTPartnerOrdersUI.openOrderDetail(pushOrderId);return true;}
      const orders=d.getElementById('orders');
      orders?.scrollIntoView({behavior:'instant',block:'start'});
      const candidates=[...d.querySelectorAll('[data-id]')];
      const hit=candidates.find(el=>{
        const id=String(el.getAttribute('data-id')||'');
        return (pushOrderId&&id===pushOrderId) ||
          (pushOrderNo&&String(el.textContent||'').includes(pushOrderNo));
      });
      const card=hit?.closest('article,.jpt-cob-card')||hit;
      if(card){
        card.scrollIntoView({behavior:'instant',block:'center'});
        card.classList.add('alarmPulse');
        setTimeout(()=>card.classList.remove('alarmPulse'),6000);
        return true;
      }
    }catch(e){}
    return false;
  }
  frame.addEventListener('load',function(){
    hideBoot();
    if(q.get('push')==='order'){
      let n=0;
      const t=setInterval(()=>{if(focusPushedOrder()||++n>30)clearInterval(t)},250);
    }
  },{once:true});

  // Never leave the launcher covering the dashboard indefinitely.
  setTimeout(hideBoot,3000);
})();
</script>
</body>
</html>
