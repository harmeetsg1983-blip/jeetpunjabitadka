<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPT Campaign Preview</title>
<style>body{margin:0;background:#080808;color:#fff;font-family:system-ui;padding:16px}.box{border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:12px}h2{color:#d8ae42;margin:0 0 12px}label{display:block;color:#aaa;font-size:11px;margin:10px 0 4px}input,select{width:100%;padding:10px;border-radius:9px;border:1px solid #444;background:#151515;color:#fff}button{margin-top:12px;padding:10px 13px;border-radius:9px;border:1px solid #d8ae42;background:#d8ae42;color:#111;font-weight:900}.banner{height:220px;border-radius:12px;overflow:hidden;background:#111;display:grid;place-items:center;color:#777;border:1px solid #333}.flow{color:#d8ae42;font-weight:800}</style></head>
<body><div class="box"><h2>Campaign Manager Preview</h2><div class="flow">Upload → Crop/Fit → Preview → Schedule → Save → Live</div><label>Sponsor / Campaign name</label><input placeholder="Example: Weekend Offer"><label>Target outlet</label><select><option>All live outlets</option><option>Jeet Punjabi Tadka (JPT-001)</option><option>99 Meal Express (NME-004)</option></select><label>Start / End</label><input type="datetime-local"><input type="datetime-local"><label>Media</label><input type="file" accept="image/*,video/*" id="file"><div class="banner" id="preview">Choose image/video for preview</div><button type="button" onclick="alert('Preview only — no production save is performed.')">Preview Save Flow</button></div>
<script>
file.onchange=()=>{const f=file.files[0];if(!f)return;const u=URL.createObjectURL(f);preview.innerHTML='';const el=f.type.startsWith('video/')?document.createElement('video'):document.createElement('img');el.src=u;el.style='width:100%;height:100%;object-fit:cover;display:block';if(el.tagName==='VIDEO'){el.muted=true;el.autoplay=true;el.loop=true;el.playsInline=true}preview.appendChild(el)}
</script></body></html>
