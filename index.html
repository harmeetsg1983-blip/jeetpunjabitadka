<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeet Punjabi Tadka</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        button { background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Jeet Punjabi Tadka</h2>
    <div class="card">
        <h3>Gobi Manchurian</h3>
        <p>Price: ₹185</p>
        <button onclick="placeOrder('Gobi Manchurian', 185)">WhatsApp पर ऑर्डर करें</button>
    </div>

    <script>
        async function placeOrder(itemName, price) {
            const orderId = "JPT" + Math.floor(100000 + Math.random() * 900000);
            const customerName = prompt("अपना नाम दर्ज करें:") || "Customer";
            const customerPhone = prompt("अपना मोबाइल नंबर दर्ज करें:") || "";
            const address = prompt("अपना पता दर्ज करें:") || "";

            const orderData = {
                order_id: orderId,
                customer_name: customerName,
                customer_phone: customerPhone,
                address: address,
                items: [{ name: itemName, price: price, quantity: 1 }],
                total_amount: price,
                status: 'new'
            };

            if (window.saveOrderToSupabase) {
                await window.saveOrderToSupabase(orderData);
            }

            const msg = `JEET PUNJABI TADKA — NEW ORDER\nOrder No: ${orderId}\n\n${itemName} x 1 = ₹${price}\n\nTotal: ₹${price}\n\nCustomer: ${customerName}\nMobile: ${customerPhone}\nAddress: ${address}`;
            window.location.href = `https://wa.me/919148161094?text=${encodeURIComponent(msg)}`;
        }
    </script>
