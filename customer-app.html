<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="./customer-manifest.webmanifest?v=1">
<link rel="icon" href="./jpt-customer-icon-512.png" type="image/png">
<title>Jeet Punjabi Tadka — Customer App</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;background:#090909}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#3a2a0b 0,#090909 48%,#050505 100%);padding:24px}
.card{width:min(430px,94vw);border:1px solid #d8ae42;border-radius:26px;padding:24px 20px;text-align:center;background:linear-gradient(145deg,#1b1509,#090909);box-shadow:0 20px 70px #000}
.logo{width:min(270px,75vw);aspect-ratio:1;margin:auto;border-radius:28px;object-fit:cover;border:2px solid #d8ae42;box-shadow:0 0 35px #d8ae4255}
h1{font:900 22px system-ui;color:#f4d77a;margin:17px 0 6px}.sub{color:#bbb;font:500 13px system-ui;margin-bottom:16px}
button{width:100%;border:1px solid #d8ae42;border-radius:13px;padding:13px 16px;font:900 15px system-ui;cursor:pointer}
#install{background:#d8ae42;color:#111}#open{background:#17130a;color:#f4d77a;margin-top:9px}
#share{position:fixed;right:14px;bottom:78px;z-index:15;width:auto;padding:11px 14px;background:#151515;color:#f4d77a;box-shadow:0 8px 24px #0008}
.hidden{display:none!important}
</style>
</head>
<body>
<iframe id="app" src="./index.html?v=customer-shell-1" title="Jeet Punjabi Tadka Customer App"></iframe>
<div id="gate">
  <div class="card">
    <img class="logo" src="./jpt-customer-icon-512.png" alt="Jeet Punjabi Tadka">
    <h1>JEET PUNJABI TADKA</h1>
    <div class="sub">Customer App • Direct Ordering</div>
    <button id="install">INSTALL APP</button>
    <button id="open">OPEN APP</button>
  </div>
</div>
<button id="share" class="hidden" type="button">↗ SHARE APP</button>
<script>
(function(){
'use strict';
var gate=document.getElementById('gate'),install=document.getElementById('install'),open=document.getElementById('open'),share=document.getElementById('share');
var deferred=null;
function hideGate(){gate.classList.add('hidden');share.classList.remove('hidden');}
open.addEventListener('click',hideGate);
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;install.classList.remove('hidden');});
install.addEventListener('click',async function(){
  if(!deferred){hideGate();return;}
  deferred.prompt();
  try{await deferred.userChoice;}catch(_){}
  deferred=null;
  hideGate();
});
share.addEventListener('click',async function(){
  var data={title:'Jeet Punjabi Tadka — Customer App',text:'Open Jeet Punjabi Tadka Customer App',url:new URL('./customer-app.html',location.href).href};
  if(navigator.share){try{await navigator.share(data);}catch(_){}}
  else if(navigator.clipboard){try{await navigator.clipboard.writeText(data.url);share.textContent='✓ LINK COPIED';setTimeout(()=>share.textContent='↗ SHARE APP',1600);}catch(_){}}
});
window.addEventListener('appinstalled',function(){hideGate();});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./customer-app-sw.js?v=1',{scope:'./'}).catch(function(){});});}
})();
</script>
</body>
</html>
