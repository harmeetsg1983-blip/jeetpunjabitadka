<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPT Live Order Tracking — Architecture Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#17191d}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f5f6f8}.top{height:66px;padding:10px 16px;background:#fff;border-bottom:1px solid #e7e7e7;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;font-size:18px}.code{font-size:11px;color:#777}.close{border:1px solid #ddd;background:#fff;border-radius:50%;width:40px;height:40px}
.banner{height:145px;background:linear-gradient(135deg,#111,#3b2b0e);color:#f5d879;display:flex;align-items:flex-end;padding:16px;font-weight:1000;font-size:21px}.banner small{display:block;color:#fff;margin-top:4px;font-size:11px}
.map{height:270px;background:linear-gradient(135deg,#e1e6eb,#cbd2d9);position:relative;overflow:hidden}.pin{position:absolute;font-size:30px}.restaurant{left:22%;top:25%}.customer{right:18%;bottom:22%}.route{position:absolute;left:27%;top:36%;width:48%;height:2px;background:#18a66d;transform:rotate(20deg)}
.card{margin:-35px 16px 16px;position:relative;background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 28px #0002}.status{color:#159866;font-size:12px;font-weight:1000}.title{font-size:25px;font-weight:1000;margin:4px 0}.sub{font-size:13px;color:#8b8d92}.eta{margin-top:14px;background:#18a66d;color:#fff;border-radius:16px;padding:12px;text-align:center}.eta b{font-size:28px}.timeline{margin-top:16px}.step{display:flex;gap:10px;align-items:center;margin:11px 0;font-size:13px}.dot{width:11px;height:11px;border-radius:50%;background:#d2d5da}.dot.on{background:#18a66d}.section{margin:0 16px 16px;background:#fff;border-radius:18px;padding:15px}.row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}.actions{display:flex;gap:8px}.btn{flex:1;padding:12px;border:0;border-radius:12px;background:#f4c84a;font-weight:1000}.outlets{display:flex;gap:7px;overflow:auto;padding:0 16px 16px}.outlets button{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:99px;padding:8px 11px}.outlets .on{background:#f4c84a;border-color:#f4c84a}
</style></head><body><main class="app">
<div class="top"><div><div id="name" class="brand">Jeet Punjabi Tadka</div><div id="code" class="code">JPT-001 • Order #JPT-1234567</div></div><button class="close">✕</button></div>
<div id="banner" class="banner">Jeet Punjabi Tadka</div>
<div class="outlets" id="outlets"></div>
<div class="map"><div class="pin restaurant">🏪</div><div class="route"></div><div class="pin customer">📍</div></div>
<div class="card"><div class="status" id="statusLabel">✓ ORDER PLACED</div><div class="title" id="statusTitle">Order received</div><div class="sub" id="statusSub">Waiting for the restaurant to accept your order.</div><div class="eta"><b id="eta">45:00</b><div>estimated time</div></div><div class="timeline" id="timeline"></div></div>
<div class="section"><b>Order summary</b><div class="row"><span>Paneer Butter Masala × 1</span><b>₹189</b></div><div class="row"><span>Delivery</span><b>FREE</b></div><div class="row"><b>Total</b><b>₹189</b></div></div>
<div class="section"><b>Help & support</b><div class="row"><span>Order ID</span><b>JPT-1234567</b></div><div class="actions"><button class="btn">Support</button><button class="btn" onclick="alert('WhatsApp remains available as a secondary share action.')">WhatsApp</button></div></div>
</main><script>
const O={JPT-001:['Jeet Punjabi Tadka','#d8ae42'],SOP-002:['Shan-e-Punjab','#49b36a'],NME-004:['99 Mile Express','#f29b32'],PFA-003:['Punjabi Food Adda','#df6680'],TOP-005:['Taste of Punjab','#7b74e8']};
const S=[['new','Order received','Waiting for the restaurant to accept your order.'],['accepted','Order confirmed','Restaurant accepted your order.'],['preparing','Preparing your order','The restaurant is preparing your food.'],['ready','Ready for delivery','Your order is ready.'],['out_for_delivery','Out for delivery','Your order is on the way.'],['delivered','Delivered','Order received. Thank you!']];
let outlet='JPT-001',si=0,secs=2700;
function paint(){const o=O[outlet];name.textContent=o[0];code.textContent=outlet+' • Order #JPT-1234567';banner.textContent=o[0];banner.style.background='linear-gradient(135deg,#111,'+o[1]+')';outlets.innerHTML=Object.entries(O).map(([id,x])=>'<button class="'+(id===outlet?'on':'')+'" onclick="outlet=\''+id+'\';paint()">'+x[0]+'</button>').join('');const s=S[si];statusLabel.textContent=si===0?'✓ ORDER PLACED':si===5?'✓ DELIVERED':'✓ ON TIME';statusTitle.textContent=s[1];statusSub.textContent=s[2];timeline.innerHTML=S.map((x,i)=>'<div class="step"><span class="dot '+(i<=si?'on':'')+'"></span><b>'+x[1]+'</b></div>').join('')};paint();setInterval(()=>{secs=Math.max(0,secs-1);eta.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000);setInterval(()=>{si=Math.min(5,si+1);paint()},8000);
</script></body></html>
