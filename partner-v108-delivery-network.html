<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeet Punjabi Tadka — Restaurant Partner App V108</title><style>html,body{margin:0;width:100%;height:100%;background:#090909;overflow:hidden}#partnerFrame{width:100%;height:100%;border:0;display:block}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#090909;color:#f4d77a;font:700 16px system-ui;z-index:10}</style></head><body><div id="boot">Loading Restaurant Partner App…</div><iframe id="partnerFrame" src="./admin.html" title="Jeet Punjabi Tadka Restaurant Partner App"></iframe><script>
(function(){const frame=document.getElementById('partnerFrame');frame.addEventListener('load',()=>{const d=frame.contentDocument;document.getElementById('boot').style.display='none';const s=d.createElement('script');s.textContent=`
(function(){
 'use strict';
 function bindReady(){document.querySelectorAll('select[data-order]').forEach(sel=>{if(sel.dataset.jptNetBound==='1')return;sel.dataset.jptNetBound='1';sel.addEventListener('change',async()=>{if(sel.value!=='ready')return;const id=Number(sel.dataset.order);if(!id)return;try{const r=await sb.rpc('delivery_offer_next',{p_order_id:id});if(r.error){msg('Delivery offer: '+r.error.message);return}const x=Array.isArray(r.data)?r.data[0]:r.data;msg(x&&x.assignment_id?'🛵 READY — delivery offer sent to eligible ONLINE rider.':'🟡 READY — no eligible ONLINE rider currently available.')}catch(e){msg('Delivery bridge: '+(e.message||e))}},true)});}
 function escR(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function addRiderPanel(){if(document.getElementById('jptRiderPanel'))return;const host=document.createElement('div');host.id='jptRiderPanel';host.className='card';host.innerHTML='<h2>🛵 Delivery Partners</h2><div class="muted">Review rider onboarding. Approval enables ONLINE status.</div><div id="jptRiderList" class="offer">Loading…</div>';const offers=document.getElementById('offers');(offers?.parentNode||document.body).appendChild(host);const list=host.querySelector('#jptRiderList');async function load(){try{const r=await sb.rpc('delivery_partner_admin_queue');if(r.error){list.textContent='Rider queue: '+r.error.message;return}const rows=Array.isArray(r.data)?r.data:[];list.innerHTML=rows.length?rows.map(x=>'<div style="padding:10px;border-top:1px solid #3a301d"><b>'+escR(x.full_name||'Rider')+'</b><div class="small">'+escR(x.phone||'')+' · '+escR(x.verification_status||'pending')+' · '+escR(x.admin_status||'pending')+'</div><div class="small">Address: '+escR(x.address||'')+'</div><div style="margin-top:7px"><button class="btn online" data-approve="'+escR(x.id)+'">APPROVE</button> <button class="btn danger" data-reject="'+escR(x.id)+'">REJECT</button></div></div>').join(''):'<div class="muted">No riders awaiting review.</div>';list.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,'approve'));list.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>review(b.dataset.reject,'reject'));}catch(e){list.textContent='Rider queue unavailable: '+(e.message||e)}}async function review(id,decision){const r=await sb.rpc('delivery_partner_admin_review',{p_delivery_partner_id:id,p_decision:decision,p_reason:decision==='reject'?'Rejected during admin review':null});if(r.error){msg('Review: '+r.error.message);return}msg(decision==='approve'?'✅ Rider approved — ONLINE is now available.':'Rider rejected.');load()}load();setInterval(load,15000)}
 bindReady();addRiderPanel();new MutationObserver(bindReady).observe(document.body,{subtree:true,childList:true});
})();`;
